project:
  type: book
  output-dir: _output

filters:
  - dropcap.lua

bibliography: references.bib
csl: modern-game-engine.csl
reference-section-title: Bibliography

book:
  title: "The Modern Game Engine"
  subtitle: "Architecture, Systems and Principles"
  author: "Nicolas Bettenburg, PhD"
  date: today
  chapters:
    - index.qmd
    - introduction.qmd
    - part: "Foundations"
      chapters:
       - chapters/01-engine-renaissance.qmd
       - chapters/02-engine-architecture-at-a-glance.qmd
       - chapters/03-engine-runtime-contracts.qmd
       - chapters/04-core-loop-and-frame-lifecycle.qmd
       - chapters/05-input-and-platform-interaction.qmd
       - chapters/06-memory-handles-and-instrumentation.qmd
       - chapters/07-resource-pipeline-and-virtual-filesystem.qmd
    - part: "Gameplay"
      chapters:
       - chapters/08-entity-component-system.qmd
       - chapters/09-game-logic-scripting-and-events.qmd
       - chapters/10-managing-massive-scale.qmd
       - chapters/11-world-streaming-and-data-residency.qmd
    - part: "Rendering"
      chapters:
       - chapters/12-render-domain-architecture.qmd
       - chapters/13-render-graph-and-pipeline-extensibility.qmd
       - chapters/14-visibility-and-geometry.qmd
       - chapters/15-shading-lighting-and-global-illumination.qmd
       - chapters/16-environment-and-post-processing.qmd
    - part: "Simulation, Audio, and Networking"
      chapters:
       - chapters/17-physics-and-collision.qmd
       - chapters/18-navigation-and-spatial-decision-support.qmd
       - chapters/19-animation-systems.qmd
       - chapters/20-audio-architecture.qmd
       - chapters/21-networking-and-multiplayer.qmd
    - part: "Tools and User Interface"
      chapters:
       - chapters/22-user-interface-and-tooling.qmd
  appendices:
   - appendices/a-mathematics-for-game-engines.qmd
   - appendices/b-glossary.qmd
   - appendices/c-bibliography.qmd

format:
  pdf:
    keep-tex: true
    documentclass: scrreprt
    classoption:
      - twoside
      - open=right
    papersize: letter
    fontsize: 11pt
    linestretch: 1.2
    geometry:
      - top=1in
      - bottom=1in
      - left=1.25in
      - right=1.25in
    colorlinks: true
    linkcolor: NavyBlue
    urlcolor: NavyBlue
    citecolor: NavyBlue
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    highlight-style: github
    code-block-bg: "#f8f8f8"
    code-block-border-left: "#4a86c8"
    mainfont: "Palatino"
    sansfont: "Helvetica"
    monofont: "JetBrains Mono"
    monofontoptions:
      - Scale=0.75  # Decreased font size for code blocks
    include-in-header: preamble.tex
