format:
  pdf:
    documentclass: scrreprt
    classoption:
      - twoside
      - open=right
    papersize: letter
    fontsize: 11pt
    linestretch: 1.2
    geometry:
      - top=1in
      - bottom=1in
      - left=1.25in
      - right=1.25in
    colorlinks: true
    linkcolor: NavyBlue
    urlcolor: NavyBlue
    citecolor: NavyBlue
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    highlight-style: github
    code-block-bg: "#f8f8f8"
    code-block-border-left: "#4a86c8"
    mainfont: "Palatino"
    sansfont: "Helvetica"
    monofont: "JetBrains Mono"
    monofontoptions:
      - Scale=0.75  # Decreased font size for code blocks
    include-in-header: preamble.tex
