[workspace]
resolver = "3"
members = ["crates/engine", "crates/viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Nicolas Bettenburg <nicbet@gmail.com>"]
publish = false

# The single place dependency versions are pinned; members inherit with
# `some-dep.workspace = true`. Add an entry from the story that first needs it —
# winit/wgpu/egui land with sw-a2446a.
[workspace.dependencies]
smallworld-engine = { path = "crates/engine" }

[workspace.lints.rust]
# GPU buffer casts will want unsafe eventually; when they do, the module opts out
# locally with #[allow(unsafe_code)] and says why, rather than the whole tree being open.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
