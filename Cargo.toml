[workspace]
resolver = "3"
members = ["crates/engine", "crates/viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Nicolas Bettenburg <nicbet@gmail.com>"]
publish = false

[workspace.dependencies]
smallworld-engine = { path = "crates/engine" }

# Graphics & windowing
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"

# Math
glam = "0.33"

# Serialisation
bytemuck = { version = "1", features = ["derive"] }

# Async
pollster = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
